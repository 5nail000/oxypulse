; Отдельная папка сборки: старый .pio/build иногда блокируется IDE/антивирусом на Windows.
[platformio]
build_dir = .pio/build_fresh
data_dir = ../../web

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    oxypulse-common=file://../firmware_common
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit DPS310@^1.1.5
    adafruit/Adafruit BMP3XX Library@^2.1.6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Рабочий I2C (18/19): 1 = BMP390 (CJMCU-390), 0 = DPS310. Гипоксия всегда DPS310.
    -DWORKING_PRESSURE_BMP390=1
    ; SCD41: компенсация инерции CO₂ (0 = только сырое с чипа)
    -DSCD41_CO2_DYNAMIC_COMP=1
    -DSCD41_CO2_TAU_SEC=60
    -DSCD41_CO2_TRUST=70
    -DSCD41_CO2_COMP_MAX_DELTA_PPM=15000
    ; SCD41 ASC: 1 = автокалибровка чипа (~400 ppm), 0 = выкл (маска/контур)
    -DSCD41_ASC_ENABLED=0
