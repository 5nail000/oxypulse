; Отдельная папка сборки: старый .pio/build иногда блокируется IDE/антивирусом на Windows.
[platformio]
build_dir = .pio/build_fresh
data_dir = ../../web

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    oxypulse-common=file://../firmware_common
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit DPS310@^1.1.5
    adafruit/Adafruit BMP3XX Library@^2.1.6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    ; Реле клапанов V1–V6: 1 = active LOW (LOW на GPIO → реле ON), 0 = active HIGH
    -DGPIO_VALVE_ACTIVE_LOW=1
    ; Рабочий I2C (18/19): 1 = BMP390 (CJMCU-390), 0 = DPS310. Гипоксия всегда DPS310.
    -DWORKING_PRESSURE_BMP390=1
    ; 0 = датчика давления на рабочем контуре нет (не показывать фейковые hPa)
    -DWORKING_PRESSURE_ENABLED=0
    ; STC31-C ASC: 1 = автокалибровка (открытый воздух), 0 = выкл (маска/контур)
    -DSTC31_ASC_ENABLED=0
    ; ИГТ: дельта давления (hPa от старта мотора), первичное наполнение, таймауты, Servo1
    -DIGT_PRESSURE_DELTA_HPA=1.5
    -DIGT_WORK_PRESSURE_DELTA_HPA=1.5
    -DIGT_PRESSURE_BASELINE_LIMIT_HPA=15
    -DIGT_PRIMARY_FILL_SEC=150
    -DIGT_PRESSURE_WAIT_SEC=120
    -DIGT_RECIRC_TIMEOUT_SEC=600






























































































































    
    -DIGT_SERVO_HYPOXIA_DEG=180
    -DIGT_SERVO_NORMOXIA_DEG=0
