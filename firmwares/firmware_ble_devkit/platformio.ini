; ESP32-DEVKIT CH340: BLE central без WiFi. UART прямая коммутация 16/17 с firmware_main_devkit.
[platformio]
build_dir = .pio/build_fresh

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    oxypulse-common=file://../firmware_common
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
