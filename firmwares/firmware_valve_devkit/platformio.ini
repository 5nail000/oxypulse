; ЦУ клапанов: I²C + GPIO + ИГТ + NimBLE peripheral. Без WiFi/LittleFS/веба.
[platformio]
build_dir = .pio/build_fresh

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:copy_hw.py
lib_deps =
    oxypulse-common=file://../firmware_common
    h2zero/NimBLE-Arduino@^1.4.2
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit ADS1X15@^2.5.0
    adafruit/Adafruit DPS310@^1.1.5
    adafruit/Adafruit BMP3XX Library@^2.1.6
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DGPIO_VALVE_ACTIVE_LOW=1
    -DWORKING_PRESSURE_BMP390=1
    -DSCD41_CO2_DYNAMIC_COMP=1
    -DSCD41_CO2_TAU_SEC=60
    -DSCD41_CO2_TRUST=70
    -DSCD41_CO2_COMP_MAX_DELTA_PPM=15000
    -DSCD41_ASC_ENABLED=0
    -DIGT_PRESSURE_DELTA_HPA=1.5
    -DIGT_WORK_PRESSURE_DELTA_HPA=1.5
    -DIGT_PRESSURE_BASELINE_LIMIT_HPA=15
    -DIGT_PRIMARY_FILL_SEC=120
    -DIGT_PRESSURE_WAIT_SEC=120
    -DIGT_RECIRC_TIMEOUT_SEC=600
    -DIGT_SERVO_HYPOXIA_DEG=180
    -DIGT_SERVO_NORMOXIA_DEG=0
